<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stonks · Permissioned personal-finance agent</title>
    <meta
      name="description"
      content="Stonks, a local-first personal-finance agent: the ledger stays on the device, every action needs approval and every action is logged."
    />
    <meta name="theme-color" content="#12352a" />
    <!--
      NFR-6: a content security policy limits outbound requests to the relay.
      'self' covers the static assets and /api/*; everything else is blocked, so
      a compromised dependency cannot exfiltrate the unredacted ledger.
      frame-ancestors and the other header-only directives are left to the host:
      they cannot be delivered from a <meta> element.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; object-src 'none'; base-uri 'none'"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
